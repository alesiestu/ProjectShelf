<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProjectShelf</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">ProjectShelf</div>
  <div class="ws" id="ws">—</div>
  <div class="spacer"></div>
  <button id="language" class="language" aria-label="Change language">IT</button>
  <button id="workspaceOpen" class="workspace-button">Workspace</button>
  <button id="mcpOpen" class="mcp-button">MCP</button>
  <button id="pick">Choose Workspace…</button>
  <button id="rescan" class="primary">Rescan</button>
</header>

<section class="stats" id="stats"></section>

<section class="filters" id="filters" aria-label="Filters"></section>

<section class="todo-section" id="todoSection">
  <div class="todo-head">
    <button type="button" id="todoToggle" class="todo-toggle" aria-expanded="true">
      <span id="todoChevron">⌄</span><span id="todoTitle">Todo</span><b id="todoCount">0</b>
    </button>
    <button type="button" id="todoAdd" class="primary">Add todo</button>
  </div>
  <div id="todoList" class="todo-list"></div>
</section>

<div class="bar" id="bar"><div class="fill" id="fill"></div><span id="barText"></span></div>

<main class="board" id="board"></main>

<dialog id="notionDialog" class="notion-dialog">
  <form method="dialog" id="notionForm">
    <h2 id="notionTitle">Notion</h2>
    <label for="notionUrl" id="notionLabel">Notion page URL</label>
    <input id="notionUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://www.notion.so/…">
    <p id="notionError" class="notion-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="notionRemove" class="danger">Remove</button>
      <span class="dialog-spacer"></span>
      <button type="button" id="notionCancel">Cancel</button>
      <button type="submit" id="notionSave" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="todoDialog" class="notion-dialog todo-dialog">
  <form method="dialog" id="todoForm">
    <h2 id="todoDialogTitle">Add todo</h2>
    <label for="todoText" id="todoTextLabel">Task</label>
    <input id="todoText" type="text" autocomplete="off" maxlength="240">
    <label id="todoProjectsLabel">Projects</label>
    <div id="todoProjects" class="todo-projects"></div>
    <p id="todoError" class="notion-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="todoCancel">Cancel</button>
      <button type="submit" id="todoSave" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="gitDialog" class="notion-dialog git-dialog">
  <div class="git-dialog-body">
    <div class="git-dialog-head">
      <h2 id="gitTitle">Git status</h2>
      <button type="button" id="gitClose">×</button>
    </div>
    <div id="gitSummary" class="git-summary"></div>
    <div id="gitFiles" class="git-files"></div>
    <details id="gitDiffPanel" class="git-diff-panel">
      <summary id="gitDiffTitle">Diff</summary>
      <pre id="gitDiff"></pre>
    </details>
    <button type="button" id="gitTerminal" class="primary">Open Terminal</button>
  </div>
</dialog>

<dialog id="mcpDialog" class="notion-dialog mcp-dialog">
  <form method="dialog" id="mcpForm">
    <div class="git-dialog-head"><h2 id="mcpTitle">MCP locale</h2><button type="button" id="mcpClose">×</button></div>
    <p id="mcpDescription" class="mcp-description"></p>
    <div id="mcpStatus" class="mcp-status"></div>
    <label id="mcpEndpointLabel" for="mcpEndpoint">Endpoint</label>
    <input id="mcpEndpoint" readonly>
    <label id="mcpTokenLabel" for="mcpToken">Token</label>
    <input id="mcpToken" readonly type="password">
    <div class="dialog-actions mcp-actions">
      <button type="button" id="mcpReveal">Show</button>
      <button type="button" id="mcpRotate">Regenerate token</button>
      <span class="dialog-spacer"></span>
      <button type="button" id="mcpStart" class="primary">Start</button>
      <button type="button" id="mcpStop">Stop</button>
    </div>
    <label id="mcpConfigLabel" for="mcpConfig">Codex configuration</label>
    <textarea id="mcpConfig" readonly rows="6"></textarea>
    <button type="button" id="mcpCopyConfig">Copy configuration</button>
    <label id="mcpPromptLabel" for="mcpPrompt">Installation prompt</label>
    <textarea id="mcpPrompt" readonly rows="7"></textarea>
    <button type="button" id="mcpCopyPrompt">Copy prompt</button>
  </form>
</dialog>

<dialog id="workspaceDialog" class="notion-dialog workspace-dialog">
  <form method="dialog" id="workspaceForm">
    <div class="git-dialog-head"><h2 id="workspaceTitle">Remote workspaces</h2><button type="button" id="workspaceClose">×</button></div>
    <div id="workspaceList" class="workspace-list"></div>
    <div class="workspace-form-head"><b id="workspaceFormTitle">Add workspace</b><button type="button" id="workspaceNew">+</button></div>
    <label id="workspaceAliasLabel" for="workspaceAlias">SSH alias</label>
    <input id="workspaceAlias" autocomplete="off" spellcheck="false" placeholder="dev-vm">
    <label id="workspacePathLabel" for="workspacePath">Remote path</label>
    <input id="workspacePath" autocomplete="off" spellcheck="false" placeholder="/home/user/workspace">
    <label id="workspaceNameLabel" for="workspaceName">Display name</label>
    <input id="workspaceName" autocomplete="off" maxlength="80" placeholder="Dev VM">
    <p id="workspaceError" class="notion-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="workspaceRemove" class="danger">Remove</button>
      <button type="button" id="workspaceTest">Test connection</button>
      <span class="dialog-spacer"></span>
      <button type="button" id="workspaceCancel">Cancel</button>
      <button type="submit" id="workspaceSave" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
